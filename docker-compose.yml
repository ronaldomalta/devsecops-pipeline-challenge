version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devsecops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendamento_consultas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendamento_consultas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devsecops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsecops-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devsecops-net

volumes:
  postgres_data:

networks:
  devsecops-net:
    driver: bridge