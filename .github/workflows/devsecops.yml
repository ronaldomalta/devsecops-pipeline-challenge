name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # 1 - PROTEÇÃO DE SEGREDOS
  # ==========================================
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # 2 - TESTES E BUILD DA API
  # ==========================================
  test-build:
    name: Testes e Build
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Executar testes
        run: npm test

      - name: Compilar TypeScript
        run: npm run build


  # ==========================================
  # 3 - SAST COM SEMGREP
  # ==========================================
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: test-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Executar Semgrep
        run: semgrep scan --config auto --error --exclude=".github/workflows/**" .


  # ==========================================
  # 4 - BUILD DA IMAGEM DOCKER
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: semgrep

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t devsecops-api:latest .


  # ==========================================
  # 5 - SCAN DA IMAGEM COM TRIVY
  # ==========================================
  trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t devsecops-api:latest .

      - name: Executar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-api:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  # ==========================================
  # 6 - VALIDAÇÃO TERRAFORM
  # ==========================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: trivy

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


  # ==========================================
  # 7 - SCAN DE IAC COM CHECKOV
  # ==========================================
  checkov:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: false


  # ==========================================
  # 8 - DAST COM OWASP ZAP
  # ==========================================
